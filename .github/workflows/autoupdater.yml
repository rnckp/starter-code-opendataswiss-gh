name: autoupdater
run-name: autoupdater
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '35 3 * * 0' # Sundays at 03:35 UTC.

permissions:
  contents: read

concurrency:
  group: autoupdater-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.8'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      - run: uv sync --locked
      - run: uv run --no-sync ruff format --check updater.py tests
      - run: uv run --no-sync ruff check updater.py tests
      - run: uv run --no-sync pytest

  python_script:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.8'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
          check-latest: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Run updater
        run: uv run --no-sync python updater.py

      - name: Verify generated files before publishing
        run: uv run --no-sync python updater.py --verify-output

      - name: Push generated files to target repository
        uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2 # v1.7.3
        env:
          API_TOKEN_GITHUB: ${{ secrets.PAT }}
        with:
          source-directory: '_work'
          destination-github-username: 'rnckp'
          destination-repository-name: 'starter-code_opendataswiss'
          target-branch: main
          user-name: 'github-actions[bot]'
          user-email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit-message: 'chore(data): regenerate starter notebooks from ORIGIN_COMMIT'
