[project]
name = "starter-code-opendataswiss-gh"
version = "0.1.0"
description = "Generate starter code for opendata.swiss datasets"
readme = "README.md"
requires-python = ">=3.12, <3.15"
dependencies = [
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "seaborn>=0.13.2",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
