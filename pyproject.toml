[project]
name = "starter-code-opendataswiss-gh"
version = "0.1.0"
description = "Generate starter code for opendata.swiss datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "urllib3>=2.7.0",
]

[project.scripts]
updater = "updater:main"

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]

[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19"]
# eMudhra/emSign security fix; retain while the cutoff excludes the patched release.
exclude-newer-package = { certifi = false }
exclude-newer = "7 days"
