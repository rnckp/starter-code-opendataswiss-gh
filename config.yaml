# Configuration for updater.py
# Open Data Swiss starter code generator

provider:
  name: "opendata.swiss"
  link: "https://opendata.swiss/"
  dataportal_base: "https://opendata.swiss/de/dataset/"
  ckan_api: "https://ckan.opendata.swiss/api/3/action/current_package_list_with_resources"
  language: "de"

github:
  account: "rnckp"
  repo_name: "starter-code_opendataswiss"
  branch: "main"
  rmarkdown_output: "01_r-markdown/"
  python_output: "02_python/"

paths:
  temp_prefix: "_work/"
  template_folder: "_templates/"
  templates:
    readme: "template_md_readme.md"
    header: "template_md_header.md"
    python: "template_python.ipynb"
    rmarkdown: "template_rmarkdown.Rmd"

api:
  limit: 500
  sleep_seconds: 2
  timeout_seconds: 30

http:
  user_agent_generator: "OpendataSwiss-StarterCode-Generator/1.0"
  user_agent_python: "OpendataSwiss-StarterCode-Python/1.0"
  user_agent_r: "OpendataSwiss-StarterCode-R/1.0"

display:
  title_max_chars: 200
  readme_resource_limit: 50

# Metadata keys to extract for dataset info
keys_dataset:
  - "identifier"
  - "publisher.name"
  - "organization.display_name"
  - "organization.url"
  - "maintainer"
  - "maintainer_email"
  - "keywords"
  - "issued"
  - "metadata_created"
  - "metadata_modified"

keys_distributions:
  - "id"
  - "name"
  - "package_id"
  - "description"
  - "issued"
  - "modified"
  - "license"
  - "rights"
